# Ground-station machine config for Longhao's home machine.
# Same KEY="value" format as fsc_PegasusSimulator/scripts/config/*.conf, but read by
# src/Common/machine_config.py, NOT sourced by a shell: values are literal, no $VAR
# expansion.
#
# Selected automatically when this machine's hostname equals HOSTNAME, or explicitly
# with FSC_GS_MACHINE=longhao_home_machine (a name in this directory or a path).
# HOSTNAME is NOT filled in yet: set it to the output of `hostname` on that machine,
# or launch with FSC_GS_MACHINE=longhao_home_machine.
HOSTNAME=""

# LLM status assistant / VLM camera search (VLM tab). The proxy on the LLM host,
# reached over NetBird; it has no authentication, so only NetBird peers the access
# policy allows can reach it. This is the address the station used from 2026-09-26
# until the per-machine split.
LLM_BASE_URL="http://100.103.152.77:8080"
LLM_MODEL="qwen2.5vl:7b"

# Known obstacles for LLM route planning; see fsc_lab_machine.conf.
OBSTACLES_FILE="obstacles_lab.json"

# Camera checks: "local" or "openrouter"; see fsc_lab_machine.conf.
VLM_BACKEND="local"
OPENROUTER_MODEL="anthropic/claude-sonnet-5.5"
