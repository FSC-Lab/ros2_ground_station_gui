# Ground-station machine config for the FSC Lab machine (fsc-jupiter).
# Same KEY="value" format as fsc_PegasusSimulator/scripts/config/*.conf, but read by
# src/Common/machine_config.py, NOT sourced by a shell: values are literal, no $VAR
# expansion.
#
# Selected automatically when this machine's hostname equals HOSTNAME, or explicitly
# with FSC_GS_MACHINE=fsc_lab_machine (a name in this directory or a path).
HOSTNAME="fscjupiter-MS-7C75"

# LLM status assistant / VLM camera search (VLM tab). The proxy on the LLM host,
# reached over NetBird; it has no authentication, so only NetBird peers the access
# policy allows can reach it. Checked 2026-10-22: /api/health and /api/chat up,
# qwen2.5vl:7b and qwen2.5:7b offered.
LLM_BASE_URL="http://100.103.237.60:8081"
LLM_MODEL="qwen2.5vl:7b"

# Known obstacles for LLM route planning (a file in this directory, or a path). The real
# arena: obstacles tracked as OptiTrack rigid bodies. Override with FSC_GS_OBSTACLES.
OBSTACLES_FILE="obstacles_lab.json"

# Camera checks (the VLM verdict on a snapshot): "local" = LLM_MODEL on LLM_BASE_URL, or
# "openrouter" = OPENROUTER_MODEL via openrouter.ai (sends camera frames off-site). The
# key is NOT kept here: OPENROUTER_API_KEY in the environment, or the file
# ~/.config/fsc_gs/openrouter_key (one line, chmod 600).
VLM_BACKEND="local"
OPENROUTER_MODEL="anthropic/claude-sonnet-5.5"
